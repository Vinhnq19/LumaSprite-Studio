name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22.18", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run check
      - name: Installed package runs
        shell: bash
        run: |
          # The prepare script runs Vite; its stdout precedes the .tgz filename.
          archive="$(npm pack --silent | tail -n 1)"
          if [[ -z "$archive" || ! -f "$archive" ]]; then
            echo "::error::npm pack did not produce a valid archive: $archive"
            exit 1
          fi
          mkdir -p ../studio-smoke
          npm install --prefix ../studio-smoke --no-audit --no-fund "$PWD/$archive"
          node ../studio-smoke/node_modules/lumasprite-studio/bin/lumasprite.js --help
          node ../studio-smoke/node_modules/lumasprite-studio/bin/lumasprite.js agent --help
